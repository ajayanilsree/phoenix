{% extends "base/storefront.html" %}
{% block title %}Register | Phoenix{% endblock %}
{% block content %}
<section class="auth-page">
  <form method="post" class="auth-card">
    {% csrf_token %}
    <p class="eyebrow">Customer account</p>
    <h1>Create your Phoenix account</h1>
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
    {% endfor %}
    <button class="btn btn-primary wide" type="submit">Create Account</button>
  </form>
</section>
{% endblock %}
